<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f1f3f9;--card:#fff;--tx:#1b2033;--mu:#7a8299;--bd:#e6e9f2;--ac:#6366f1;--ac2:#8b5cf6;--ok:#10b981;--ko:#ef4444;--sh:0 4px 18px rgba(40,50,100,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1119;--card:#1a1d2b;--tx:#eef0f8;--mu:#98a0b8;--bd:#2a2e42;--ok:#34d399;--ko:#f87171;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1119;--card:#1a1d2b;--tx:#eef0f8;--mu:#98a0b8;--bd:#2a2e42;--ok:#34d399;--ko:#f87171;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:0 14px 28px}
header{margin:0 -14px 16px;padding:22px 18px 20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:21px;letter-spacing:-.3px}header small{opacity:.85;display:block;font-size:12px}
header input{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;padding:8px 10px;font:inherit;color-scheme:dark}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
h2{font-size:15px;margin:0 0 14px;font-weight:700}
input,button{font:inherit;color:var(--tx)}
input:not([type=month]){background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;outline:0;transition:border .15s}
input:not([type=month]):focus{border-color:var(--ac)}
.pie{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut{position:relative;width:220px;height:220px}.donut svg{width:100%;height:100%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c small{color:var(--mu);font-size:12px}.donut .c b{font-size:20px}
.leg{width:100%;display:grid;gap:8px}
.leg div{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.leg em{margin-left:auto;font-style:normal;color:var(--mu);white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.sum small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}.sum b{font-size:14px}
.in{color:var(--ok)}.out{color:var(--ko)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.row{display:flex;gap:8px;margin-bottom:12px}.row>*{min-width:0}
.lbl{font-size:12px;color:var(--mu);margin:2px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.lh .lbl{margin:0}
.ed{border:0;background:none;color:var(--ac);font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px}
.chip.del{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 10%,transparent);animation:wob .5s ease-in-out infinite alternate}
.chip.del b{color:var(--ko);font-size:13px}
@keyframes wob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.addc{background:var(--bg);border:0;color:var(--ac);font-weight:700;border-radius:14px;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px rgba(99,102,241,.35)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.tx:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic i{width:12px;height:12px;border-radius:50%;display:block}
.tx .m{flex:1;min-width:0}.tx .m small{display:block;color:var(--mu);font-size:12px}
.tx .x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px;padding:6px}
.empty{color:var(--mu);text-align:center;padding:16px 0}
.bar{height:18px;background:var(--bg);border-radius:99px;overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);border-radius:99px;transition:width .5s}
.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<header><div><h1>💰 Mis Finanzas</h1><small>Pesos chilenos (CLP)</small></div><input type="month" id="mes"></header>

<section class="card"><h2>Gastos por categoría</h2><div class="pie" id="pie"></div></section>

<div class="sum">
<div><small>Ingresos</small><b class="in" id="si">$0</b></div>
<div><small>Gastos</small><b class="out" id="sg">$0</b></div>
<div><small>Balance</small><b id="sb">$0</b></div>
</div>

<section class="card"><h2>Nuevo movimiento</h2>
<div class="seg"><button id="tg" class="on">Gasto</button><button id="ti">Ingreso</button></div>
<div class="row"><input id="monto" type="number" inputmode="numeric" min="0" placeholder="Monto $" style="flex:1.2"><input id="fecha" type="date" style="flex:1"></div>
<div class="lh"><div class="lbl">Categoría</div><button class="ed" id="ed">Editar</button></div>
<div class="chips" id="chips"></div>
<div class="row"><input id="ncat" placeholder="Crear nueva categoría"><button class="addc" id="addcat">+ Agregar</button></div>
<button class="btn" id="add">Guardar movimiento</button>
</section>

<section class="card"><h2>Movimientos del mes</h2><div id="list"></div></section>

<section class="card"><h2>🎯 Meta de ahorro</h2>
<div class="row" style="margin:0"><input id="gn" placeholder="Nombre (ej: Vacaciones)"><input id="gm" type="number" inputmode="numeric" min="0" placeholder="Meta $"></div>
<div class="bar"><i id="gb" style="width:0"></i></div>
<div class="mu" id="gt">Define una meta para ver tu avance.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#6366f1","#ef4444","#f59e0b","#10b981","#06b6d4","#ec4899","#8b5cf6","#84cc16","#f97316","#14b8a6"];
const def={v:2,tx:[],cats:{gasto:["Alimentación","Vivienda","Transporte","Servicios","Salud","Ocio"],ingreso:["Sueldo","Freelance"]},goal:{name:"",amount:0}};
let S=def,tipo="gasto",sel="";
const save=()=>{try{localStorage.setItem("finanzas-v1",JSON.stringify(S))}catch(e){}};
try{const r=localStorage.getItem("finanzas-v1");if(r)S=Object.assign({},def,JSON.parse(r))}catch(e){}
S.cats.gasto=S.cats.gasto.filter(c=>c.toLowerCase()!="otros");S.cats.ingreso=S.cats.ingreso.filter(c=>c.toLowerCase()!="otros");save();
const col=(t,c)=>{const i=S.cats[t].indexOf(c);return i<0?"#94a3b8":COL[i%COL.length]};
const hoy=new Date().toISOString().slice(0,10);
$("mes").value=hoy.slice(0,7);$("fecha").value=hoy;$("mes").onchange=()=>render();

function setTipo(t){tipo=t;sel=S.cats[t][0]||"";$("tg").className=t=="gasto"?"on":"";$("ti").className=t=="ingreso"?"on":"";chips()}
let edit=false;
$("ed").onclick=()=>{edit=!edit;$("ed").textContent=edit?"Listo":"Editar";chips()};
function chips(){$("chips").innerHTML=S.cats[tipo].map(c=>`<button class="chip${edit?" del":c==sel?" on":""}" style="--c:${col(tipo,c)}" data-c="${esc(c)}"><span class="dot" style="background:${col(tipo,c)}"></span>${esc(c)}${edit?" <b>✕</b>":""}</button>`).join("")||'<span class="mu">No hay categorías. Crea una abajo.</span>';
 $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c;
  if(edit){S.cats[tipo]=S.cats[tipo].filter(x=>x!==c);if(sel===c)sel=S.cats[tipo][0]||"";save();chips();render()}
  else{sel=c;chips()}})}
$("tg").onclick=()=>setTipo("gasto");$("ti").onclick=()=>setTipo("ingreso");

$("addcat").onclick=()=>{const v=$("ncat").value.trim();if(!v)return;
 if(!S.cats[tipo].includes(v))S.cats[tipo].push(v);
 sel=v;$("ncat").value="";save();chips();render()};

$("add").onclick=()=>{const m=Math.round(+$("monto").value);if(!m||m<=0){$("monto").focus();return}
 if(!sel){$("ncat").focus();return}
 const f=$("fecha").value||hoy;
 S.tx.push({id:Date.now(),tipo,monto:m,cat:sel,fecha:f});
 $("monto").value="";save();$("mes").value=f.slice(0,7);render()};

$("gn").oninput=$("gm").oninput=()=>{S.goal={name:$("gn").value,amount:+$("gm").value||0};save();render(true)};
$("gn").value=S.goal.name||"";$("gm").value=S.goal.amount||"";
window.del=id=>{S.tx=S.tx.filter(t=>t.id!==id);save();render()};

function render(noList){
 const mes=$("mes").value;
 const tx=S.tx.filter(t=>t.fecha.startsWith(mes)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id);
 const ing=tx.filter(t=>t.tipo=="ingreso").reduce((a,t)=>a+t.monto,0);
 const gas=tx.filter(t=>t.tipo=="gasto").reduce((a,t)=>a+t.monto,0);
 const bal=ing-gas;
 $("si").textContent=fmt(ing);$("sg").textContent=fmt(gas);
 $("sb").textContent=fmt(bal);$("sb").className=bal>=0?"in":"out";

 const by={};tx.filter(t=>t.tipo=="gasto").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.monto);
 const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 if(!ents.length){$("pie").innerHTML='<div class="empty">Aún no hay gastos este mes.</div>'}
 else{
  const r=34,C=2*Math.PI*r;let off=0,segs="",leg="";
  ents.forEach(([c,v])=>{const l=v/gas*C,k=col("gasto",c);
   segs+=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${k}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;
   leg+=`<div><span class="dot" style="background:${k}"></span><span>${esc(c)}</span><em>${fmt(v)} · ${Math.round(v/gas*100)}%</em></div>`});
  $("pie").innerHTML=`<div class="donut"><svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">${segs}</g></svg><div class="c"><small>Total gastado</small><b>${fmt(gas)}</b></div></div><div class="leg">${leg}</div>`;
 }

 if(noList!==true){
  $("list").innerHTML=tx.length?tx.map(t=>{const k=col(t.tipo,t.cat);return `<div class="tx"><div class="ic" style="background:color-mix(in srgb,${k} 16%,transparent)"><i style="background:${k}"></i></div><div class="m"><b>${esc(t.cat)}</b><small>${t.fecha.split("-").reverse().join("/")}</small></div><b class="${t.tipo=="gasto"?"out":"in"}">${t.tipo=="gasto"?"−":"+"}${fmt(t.monto)}</b><button class="x" onclick="del(${t.id})" aria-label="Eliminar">✕</button></div>`}).join(""):'<div class="empty">Sin movimientos este mes.</div>';
 }

 const g=S.goal.amount;
 if(g>0){const ah=Math.max(bal,0),p=Math.min(ah/g*100,100);
  $("gb").style.width=p+"%";
  $("gt").textContent=`${S.goal.name?S.goal.name+": ":""}${fmt(ah)} de ${fmt(g)} (${Math.round(p)}%) — ahorro del mes.${ah>=g?" ¡Meta lograda! 🎉":" Faltan "+fmt(g-ah)+"."}`;
 }else{$("gb").style.width="0";$("gt").textContent="Define una meta para ver tu avance."}
}
setTipo("gasto");render();
</script>
</body>
</html>
