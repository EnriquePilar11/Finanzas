<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitácora — Finanzas personales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#FAFAF8; --bg-card:#FFFFFF; --border:#E7E5DE; --text:#1A2E22; --muted:#6b716c;
    --accent:#2D6A4F; --accent-soft:#EAF0EC; --warn:#C9A227; --warn-soft:#FBF3DC;
    --danger:#C1443C; --danger-soft:#FBE8E6; --hover:#F1F1EC; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  [data-theme="dark"]{
    --bg:#0B0C0B; --bg-card:#161715; --border:#2A2B28; --text:#F2F1EC; --muted:#9A9C96;
    --accent:#4E9C77; --accent-soft:#173125; --warn:#C9A227; --warn-soft:#2E2712;
    --danger:#E0685D; --danger-soft:#341714; --hover:#1E1F1C; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
  h1,h2,.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}

  #app{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;padding:16px 10px;}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 20px;}
  .brand .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .brand span{font-size:18px;}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:none;border-radius:10px;
    color:var(--muted);font-size:14px;text-align:left;}
  .nav button:hover{background:var(--hover);}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .theme-toggle{display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:none;border-radius:10px;
    color:var(--muted);font-size:14px;width:100%;text-align:left;}
  .theme-toggle:hover{background:var(--hover);}

  .main{flex:1;padding:28px 32px;max-width:1100px;margin:0 auto;width:100%;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .header h1{font-size:26px;margin:0;font-weight:400;}
  .header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px;}
  .btn:hover{background:var(--hover);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;font-weight:600;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{border:none;background:none;color:var(--muted);}

  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
  .p4{padding:16px;} .p5{padding:20px;}
  .grid{display:grid;gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:800px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .amount{font-size:20px;font-family:Georgia,serif;margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead{background:var(--hover);text-align:left;}
  th,td{padding:10px 12px;}
  tbody tr{border-top:1px solid var(--border);}
  tbody tr:hover{background:var(--hover);}
  .icon-btn{background:none;border:none;color:var(--muted);padding:4px;}
  .icon-btn:hover{color:var(--text);}

  .cat-pill{display:inline-flex;align-items:center;gap:6px;}
  .cat-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}

  .bar-track{width:100%;height:12px;border-radius:99px;background:var(--hover);overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .4s;}
  .bar-track-sm{height:6px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:16px;}
  .modal{background:var(--bg-card);border-radius:16px;width:100%;max-width:420px;padding:22px;max-height:90vh;overflow-y:auto;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:10px 0;}

  .alert{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;}
  .alert-warn{background:var(--warn-soft);color:var(--warn);}
  .alert-danger{background:var(--danger-soft);color:var(--danger);}

  .filters{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1fr;gap:8px;}
  @media(max-width:900px){.filters{grid-template-columns:1fr 1fr;}}
  .search-wrap{position:relative;}
  .search-wrap input{padding-left:30px;}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}

  .day-group{padding:14px 16px;}
  .expense-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .expense-row .desc{flex:1;min-width:0;}
  .expense-row .desc p{margin:0;font-size:13.5px;}
  .expense-row .desc span{font-size:11.5px;color:var(--muted);}
  .expense-row .actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
  .expense-row:hover .actions{opacity:1;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

  @media(max-width:760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;padding:10px;border-right:none;border-bottom:1px solid var(--border);}
    .brand{padding:4px 8px;}
    .nav{flex-direction:row;overflow-x:auto;}
    .nav button{white-space:nowrap;}
    .theme-toggle{display:none;}
    .main{padding:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- Categorías ---------------- */
const CATEGORIES = [
  { id:"alimentacion", name:"Alimentación", emoji:"🍔", color:"#2D6A4F" },
  { id:"hogar", name:"Hogar", emoji:"🏠", color:"#8A6A3F" },
  { id:"transporte", name:"Transporte", emoji:"🚗", color:"#3A6EA5" },
  { id:"entretenimiento", name:"Entretenimiento", emoji:"🎮", color:"#B5654A" },
  { id:"compras", name:"Compras", emoji:"🛒", color:"#8A5FBF" },
  { id:"salud", name:"Salud", emoji:"💊", color:"#C1443C" },
  { id:"educacion", name:"Educación", emoji:"📚", color:"#2F7A78" },
  { id:"suscripciones", name:"Suscripciones", emoji:"💳", color:"#C9A227" },
  { id:"tecnologia", name:"Tecnología", emoji:"📱", color:"#57606A" },
  { id:"otros", name:"Otros", emoji:"💰", color:"#8C8C7E" },
];
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1];
const PAYMENT_METHODS = ["Efectivo","Débito","Crédito","Transferencia","Otro"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ---------------- Utilidades ---------------- */
const fmtCLP = n => new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Math.round(n||0));
const todayISO = () => new Date().toISOString().slice(0,10);
const parseDate = iso => new Date(iso+"T00:00:00");
const sameMonth = (iso, ref) => { const d=parseDate(iso); return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth(); };
const sameDay = (iso, ref) => iso === ref.toISOString().slice(0,10);
const startOfWeek = ref => { const d=new Date(ref); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; };
const uid = () => Math.random().toString(36).slice(2,10);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- Persistencia ---------------- */
const LS_KEYS = { expenses:"finanzas_expenses", budget:"finanzas_budget", theme:"finanzas_theme" };

function seedExpenses(){
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  const d = day => new Date(y,m,day).toISOString().slice(0,10);
  const prevD = day => new Date(y,m-1,day).toISOString().slice(0,10);
  return [
    { id:uid(), monto:400000, descripcion:"Arriendo", categoria:"hogar", fecha:d(1), tipo:"Mensual", recurrente:true, diaCobro:1, metodo:"Transferencia" },
    { id:uid(), monto:25000, descripcion:"Internet", categoria:"hogar", fecha:d(5), tipo:"Mensual", recurrente:true, diaCobro:5, metodo:"Débito" },
    { id:uid(), monto:9990, descripcion:"Netflix", categoria:"suscripciones", fecha:d(10), tipo:"Mensual", recurrente:true, diaCobro:10, metodo:"Crédito" },
    { id:uid(), monto:12990, descripcion:"Spotify + Gym", categoria:"suscripciones", fecha:d(12), tipo:"Mensual", recurrente:true, diaCobro:12, metodo:"Crédito" },
    { id:uid(), monto:25000, descripcion:"Supermercado", categoria:"alimentacion", fecha:d(3), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:8500, descripcion:"Uber", categoria:"transporte", fecha:d(3), tipo:"Diario", metodo:"Efectivo" },
    { id:uid(), monto:3000, descripcion:"Café", categoria:"alimentacion", fecha:d(3), tipo:"Diario", metodo:"Efectivo" },
    { id:uid(), monto:42000, descripcion:"Compra semanal", categoria:"alimentacion", fecha:d(7), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:15000, descripcion:"Bencina", categoria:"transporte", fecha:d(8), tipo:"Diario", metodo:"Crédito" },
    { id:uid(), monto:18000, descripcion:"Cine", categoria:"entretenimiento", fecha:d(9), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:65000, descripcion:"Zapatillas", categoria:"compras", fecha:d(11), tipo:"Diario", metodo:"Crédito" },
    { id:uid(), monto:22000, descripcion:"Farmacia", categoria:"salud", fecha:d(13), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:35000, descripcion:"Curso online", categoria:"educacion", fecha:d(6), tipo:"Diario", metodo:"Transferencia" },
    { id:uid(), monto:60000, descripcion:"Audífonos", categoria:"tecnologia", fecha:d(2), tipo:"Diario", metodo:"Crédito" },
    { id:uid(), monto:30000, descripcion:"Metro (cargas)", categoria:"transporte", fecha:d(4), tipo:"Diario", metodo:"Efectivo" },
    { id:uid(), monto:45000, descripcion:"Almuerzo fuera", categoria:"alimentacion", fecha:d(10), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:15000, descripcion:"Varios", categoria:"otros", fecha:d(6), tipo:"Diario", metodo:"Efectivo" },
    { id:uid(), monto:380000, descripcion:"Arriendo", categoria:"hogar", fecha:prevD(1), tipo:"Mensual", recurrente:true, diaCobro:1, metodo:"Transferencia" },
    { id:uid(), monto:150000, descripcion:"Supermercado del mes", categoria:"alimentacion", fecha:prevD(15), tipo:"Diario", metodo:"Débito" },
    { id:uid(), monto:60000, descripcion:"Transporte del mes", categoria:"transporte", fecha:prevD(20), tipo:"Diario", metodo:"Efectivo" },
    { id:uid(), monto:30000, descripcion:"Salidas", categoria:"entretenimiento", fecha:prevD(22), tipo:"Diario", metodo:"Crédito" },
  ];
}

function loadExpenses(){
  try{
    const raw = localStorage.getItem(LS_KEYS.expenses);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const seeded = seedExpenses();
  localStorage.setItem(LS_KEYS.expenses, JSON.stringify(seeded));
  return seeded;
}
function saveExpenses(){ localStorage.setItem(LS_KEYS.expenses, JSON.stringify(state.expenses)); }
function loadBudget(){ const raw = localStorage.getItem(LS_KEYS.budget); return raw ? Number(raw) : 1000000; }
function saveBudget(){ localStorage.setItem(LS_KEYS.budget, String(state.budget)); }
function loadTheme(){ return localStorage.getItem(LS_KEYS.theme) || "light"; }
function saveTheme(){ localStorage.setItem(LS_KEYS.theme, state.theme); }

/* ---------------- Estado ---------------- */
const state = {
  expenses: loadExpenses(),
  budget: loadBudget(),
  theme: loadTheme(),
  view: "dashboard",
  monthOffset: 0,
  showModal: false,
  editing: null,
  filters: { search:"", cat:"", metodo:"", from:"", to:"", sort:"fecha-desc" },
};
let charts = {};

/* ---------------- Cálculos ---------------- */
function getRefMonth(){ const now=new Date(); return new Date(now.getFullYear(), now.getMonth()+state.monthOffset, 1); }
function getPrevMonth(ref){ return new Date(ref.getFullYear(), ref.getMonth()-1, 1); }

function computeAll(){
  const now = new Date();
  const refMonth = getRefMonth();
  const prevMonth = getPrevMonth(refMonth);
  const monthExpenses = state.expenses.filter(e=>sameMonth(e.fecha, refMonth));
  const prevMonthExpenses = state.expenses.filter(e=>sameMonth(e.fecha, prevMonth));
  const todayExpenses = state.expenses.filter(e=>sameDay(e.fecha, now));
  const weekStart = startOfWeek(now);
  const weekExpenses = state.expenses.filter(e=>parseDate(e.fecha) >= weekStart);

  const totalMonth = monthExpenses.reduce((s,e)=>s+e.monto,0);
  const totalPrevMonth = prevMonthExpenses.reduce((s,e)=>s+e.monto,0);
  const totalToday = todayExpenses.reduce((s,e)=>s+e.monto,0);
  const totalWeek = weekExpenses.reduce((s,e)=>s+e.monto,0);
  const deltaPct = totalPrevMonth>0 ? ((totalMonth-totalPrevMonth)/totalPrevMonth)*100 : null;

  const catMap = {};
  monthExpenses.forEach(e=>{ catMap[e.categoria] = (catMap[e.categoria]||0) + e.monto; });
  const byCategory = CATEGORIES.map(c=>({...c, value: catMap[c.id]||0, pct: totalMonth>0 ? ((catMap[c.id]||0)/totalMonth)*100 : 0}))
    .filter(c=>c.value>0).sort((a,b)=>b.value-a.value);

  const seen = new Map();
  state.expenses.filter(e=>e.tipo==="Mensual" && e.recurrente).forEach(e=>{
    const key = e.descripcion.toLowerCase();
    if(!seen.has(key) || e.fecha > seen.get(key).fecha) seen.set(key, e);
  });
  const recurring = Array.from(seen.values()).sort((a,b)=>(a.diaCobro||0)-(b.diaCobro||0));

  const dayMap = {};
  monthExpenses.forEach(e=>{ dayMap[e.fecha] = dayMap[e.fecha]||[]; dayMap[e.fecha].push(e); });
  const dailyGroups = Object.entries(dayMap).sort((a,b)=> a[0] < b[0] ? 1 : -1);

  const last6Months = [];
  for(let i=5;i>=0;i--){
    const ref = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const total = state.expenses.filter(e=>sameMonth(e.fecha, ref)).reduce((s,e)=>s+e.monto,0);
    last6Months.push({ mes: MESES[ref.getMonth()], total });
  }

  const daysInMonth = new Date(refMonth.getFullYear(), refMonth.getMonth()+1, 0).getDate();
  const perDay = {};
  monthExpenses.forEach(e=>{ const day=parseDate(e.fecha).getDate(); perDay[day]=(perDay[day]||0)+e.monto; });
  let acumulado = 0; const dailyEvolution = [];
  for(let d=1; d<=daysInMonth; d++){ acumulado += perDay[d]||0; dailyEvolution.push({dia:d, acumulado}); }

  const topCategory = byCategory[0];
  const dayTotals = {};
  monthExpenses.forEach(e=>{ dayTotals[e.fecha]=(dayTotals[e.fecha]||0)+e.monto; });
  const topDayEntry = Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
  const avgDaily = monthExpenses.length ? totalMonth / Math.max(now.getDate(),1) : 0;
  const budgetPct = state.budget>0 ? (totalMonth/state.budget)*100 : 0;

  let filteredHistory = [...state.expenses];
  const f = state.filters;
  if(f.search.trim()){ const q=f.search.toLowerCase(); filteredHistory = filteredHistory.filter(e=>e.descripcion.toLowerCase().includes(q)); }
  if(f.cat) filteredHistory = filteredHistory.filter(e=>e.categoria===f.cat);
  if(f.metodo) filteredHistory = filteredHistory.filter(e=>e.metodo===f.metodo);
  if(f.from) filteredHistory = filteredHistory.filter(e=>e.fecha>=f.from);
  if(f.to) filteredHistory = filteredHistory.filter(e=>e.fecha<=f.to);
  switch(f.sort){
    case "fecha-asc": filteredHistory.sort((a,b)=> a.fecha>b.fecha?1:-1); break;
    case "fecha-desc": filteredHistory.sort((a,b)=> a.fecha<b.fecha?1:-1); break;
    case "monto-asc": filteredHistory.sort((a,b)=>a.monto-b.monto); break;
    case "monto-desc": filteredHistory.sort((a,b)=>b.monto-a.monto); break;
  }

  return { refMonth, prevMonth, monthExpenses, totalMonth, totalPrevMonth, totalToday, totalWeek, deltaPct,
    byCategory, recurring, dailyGroups, last6Months, dailyEvolution, topCategory, topDayEntry, avgDaily,
    budgetPct, filteredHistory };
}

/* ---------------- Acciones ---------------- */
function setView(v){ state.view = v; render(); }
function toggleTheme(){ state.theme = state.theme==="dark" ? "light" : "dark"; saveTheme(); render(); }
function changeMonth(delta){ state.monthOffset += delta; render(); }
function resetMonth(){ state.monthOffset = 0; render(); }
function openAddModal(){ state.editing=null; state.showModal=true; render(); }
function openEditModal(id){ state.editing = state.expenses.find(e=>e.id===id); state.showModal=true; render(); }
function closeModal(){ state.showModal=false; state.editing=null; render(); }
function deleteExpense(id){ state.expenses = state.expenses.filter(e=>e.id!==id); saveExpenses(); render(); }
function upsertExpense(data){
  if(data.id){ state.expenses = state.expenses.map(e=> e.id===data.id ? data : e); }
  else { state.expenses = [...state.expenses, {...data, id: uid()}]; }
  saveExpenses(); state.showModal=false; state.editing=null; render();
}
function updateBudget(val){ state.budget = Number(val)||0; saveBudget(); render(); }
function setFilter(key, val){ state.filters[key]=val; render(); }
function exportCSV(){
  const header = "Fecha,Descripción,Categoría,Monto,Tipo,Método\n";
  const rows = state.expenses.map(e=>`${e.fecha},${e.descripcion},${catById(e.categoria).name},${e.monto},${e.tipo},${e.metodo}`).join("\n");
  const blob = new Blob([header+rows], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="gastos.csv"; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Render ---------------- */
const NAV = [
  {id:"dashboard", label:"Panel", icon:"◧"},
  {id:"diarios", label:"Gastos diarios", icon:"📅"},
  {id:"mensuales", label:"Mensuales", icon:"↻"},
  {id:"historial", label:"Historial", icon:"🕘"},
  {id:"estadisticas", label:"Estadísticas", icon:"📊"},
  {id:"presupuesto", label:"Presupuesto", icon:"🎯"},
];

function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  const c = computeAll();
  const app = document.getElementById("app");
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand"><div class="dot">💰</div><span class="serif">Bitácora</span></div>
      <nav class="nav">
        ${NAV.map(n=>`<button class="${state.view===n.id?'active':''}" onclick="setView('${n.id}')">
          <span>${n.icon}</span>${n.label}</button>`).join("")}
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span>${state.theme==="dark"?"☀️":"🌙"}</span> ${state.theme==="dark"?"Modo claro":"Modo oscuro"}
      </button>
    </aside>
    <main class="main">
      <div class="header">
        <div>
          <h1>${headerTitle()}</h1>
          <p>${MESES_LARGO[c.refMonth.getMonth()]} ${c.refMonth.getFullYear()}</p>
        </div>
        <div class="header-actions">
          <button class="btn" onclick="changeMonth(-1)">‹</button>
          <button class="btn small" onclick="resetMonth()">hoy</button>
          <button class="btn" onclick="changeMonth(1)">›</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ Agregar gasto</button>
          <button class="btn btn-ghost" title="Modo oscuro" onclick="toggleTheme()" style="display:none" id="mobileTheme">${state.theme==="dark"?"☀️":"🌙"}</button>
        </div>
      </div>
      <div id="viewRoot"></div>
    </main>
    ${state.showModal ? modalHtml() : ""}
  `;

  const root = document.getElementById("viewRoot");
  if(state.view==="dashboard") root.innerHTML = dashboardHtml(c);
  else if(state.view==="diarios") root.innerHTML = diariosHtml(c);
  else if(state.view==="mensuales") root.innerHTML = mensualesHtml(c);
  else if(state.view==="historial") root.innerHTML = historialHtml(c);
  else if(state.view==="estadisticas") root.innerHTML = estadisticasHtml(c);
  else if(state.view==="presupuesto") root.innerHTML = presupuestoHtml(c);

  if(state.view==="dashboard") setTimeout(()=>drawDonut("chartDashboard", c.byCategory), 0);
  if(state.view==="estadisticas") setTimeout(()=>{
    drawDonut("chartStatsPie", c.byCategory);
    drawBar("chartStatsBar", c.last6Months);
    drawLine("chartStatsLine", c.dailyEvolution);
  }, 0);

  if(state.showModal) attachModalHandlers();
  if(state.view==="historial") attachHistoryHandlers();
  if(state.view==="presupuesto") attachBudgetHandlers();
}

function headerTitle(){
  return {
    dashboard:"Tu panel financiero", diarios:"Gastos diarios", mensuales:"Gastos mensuales",
    historial:"Historial", estadisticas:"Estadísticas", presupuesto:"Presupuesto mensual"
  }[state.view];
}

/* ---- Dashboard ---- */
function dashboardHtml(c){
  const stats = [
    ["Gasto del mes", fmtCLP(c.totalMonth)],
    ["Gasto de hoy", fmtCLP(c.totalToday)],
    ["Gasto de la semana", fmtCLP(c.totalWeek)],
    ["Gastos registrados", c.monthExpenses.length],
  ];
  return `
  <div class="stack">
    <div class="grid grid-4">
      ${stats.map(([label,val])=>`<div class="card p4"><p class="muted small">${label}</p><p class="amount">${val}</p></div>`).join("")}
    </div>
    ${c.deltaPct!==null ? `<div class="card p4 between">
      <span class="muted small">Comparado con el mes anterior</span>
      <span style="color:${c.deltaPct>0?'var(--danger)':'var(--accent)'};font-weight:600;font-size:13.5px">
        ${c.deltaPct>0?'+':''}${c.deltaPct.toFixed(1)}%</span>
    </div>` : ""}
    <div class="grid grid-2">
      <div class="card p4">
        <p class="small" style="margin-bottom:8px">Distribución por categoría</p>
        ${c.byCategory.length===0 ? `<p class="muted small" style="text-align:center;padding:40px 0">Aún no hay gastos este mes.</p>`
          : `<div style="height:260px"><canvas id="chartDashboard"></canvas></div>`}
      </div>
      <div class="card p4">
        <p class="small" style="margin-bottom:8px">Detalle por categoría</p>
        <div style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
          ${c.byCategory.map(cat=>`
            <div class="row">
              <div class="cat-dot" style="background:${cat.color}22;color:${cat.color}">${cat.emoji}</div>
              <div style="flex:1;min-width:0">
                <div class="between small"><span>${cat.name}</span><span>${fmtCLP(cat.value)}</span></div>
                <div class="bar-track bar-track-sm" style="margin-top:4px"><div class="bar-fill" style="width:${cat.pct}%;background:${cat.color}"></div></div>
              </div>
              <span class="muted small" style="width:38px;text-align:right">${cat.pct.toFixed(0)}%</span>
            </div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---- Diarios ---- */
function diariosHtml(c){
  if(c.dailyGroups.length===0) return `<p class="muted small">No hay gastos registrados este mes.</p>`;
  return `<div class="stack">${c.dailyGroups.map(([fecha, items])=>{
    const d = parseDate(fecha); const total = items.reduce((s,e)=>s+e.monto,0);
    return `<div class="card day-group">
      <div class="between" style="margin-bottom:8px"><p style="margin:0;font-size:13.5px;font-weight:600">${d.getDate()} de ${MESES_LARGO[d.getMonth()]}</p>
      <p class="muted small">${fmtCLP(total)}</p></div>
      ${items.map(e=>{ const cat=catById(e.categoria); return `
        <div class="expense-row">
          <div class="cat-dot" style="background:${cat.color}22;color:${cat.color}">${cat.emoji}</div>
          <div class="desc"><p>${escapeHtml(e.descripcion)}</p><span>${cat.name} · ${e.metodo}</span></div>
          <span class="small">${fmtCLP(e.monto)}</span>
          <div class="actions">
            <button class="icon-btn" onclick="openEditModal('${e.id}')">✎</button>
            <button class="icon-btn" onclick="deleteExpense('${e.id}')">🗑</button>
          </div>
        </div>`;}).join("")}
    </div>`;
  }).join("")}</div>`;
}

/* ---- Mensuales ---- */
function mensualesHtml(c){
  const totalRecurring = c.recurring.reduce((s,e)=>s+e.monto,0);
  return `<div class="stack">
    <div class="card p4 between"><span class="muted small">Total gastos recurrentes mensuales</span><span class="amount">${fmtCLP(totalRecurring)}</span></div>
    <div class="card" style="overflow:hidden">
      <table>
        <thead><tr><th>Gasto</th><th>Categoría</th><th>Monto</th><th>Día de cobro</th><th></th></tr></thead>
        <tbody>
          ${c.recurring.map(e=>{ const cat=catById(e.categoria); return `
            <tr><td>${escapeHtml(e.descripcion)}</td><td><span style="color:${cat.color}">${cat.name}</span></td>
            <td>${fmtCLP(e.monto)}</td><td>${e.diaCobro||'—'}</td>
            <td style="text-align:right"><button class="icon-btn" onclick="openEditModal('${e.id}')">✎</button>
            <button class="icon-btn" onclick="deleteExpense('${e.id}')">🗑</button></td></tr>`;}).join("")}
        </tbody>
      </table>
    </div>
    <p class="muted small">Estos montos ya están incluidos en el total del mes.</p>
  </div>`;
}

/* ---- Historial ---- */
function historialHtml(c){
  const f = state.filters;
  return `<div class="stack">
    <div class="card p4 filters">
      <div class="search-wrap"><span class="search-icon">🔎</span>
        <input id="f-search" placeholder="Buscar..." value="${escapeHtml(f.search)}" /></div>
      <select id="f-cat"><option value="">Categoría</option>${CATEGORIES.map(cc=>`<option value="${cc.id}" ${f.cat===cc.id?'selected':''}>${cc.name}</option>`).join("")}</select>
      <select id="f-metodo"><option value="">Método de pago</option>${PAYMENT_METHODS.map(m=>`<option value="${m}" ${f.metodo===m?'selected':''}>${m}</option>`).join("")}</select>
      <input id="f-from" type="date" value="${f.from}" />
      <input id="f-to" type="date" value="${f.to}" />
      <select id="f-sort">
        <option value="fecha-desc" ${f.sort==='fecha-desc'?'selected':''}>Fecha (recientes)</option>
        <option value="fecha-asc" ${f.sort==='fecha-asc'?'selected':''}>Fecha (antiguos)</option>
        <option value="monto-desc" ${f.sort==='monto-desc'?'selected':''}>Monto (mayor)</option>
        <option value="monto-asc" ${f.sort==='monto-asc'?'selected':''}>Monto (menor)</option>
      </select>
    </div>
    <div style="display:flex;justify-content:flex-end"><button class="btn small" onclick="exportCSV()">Exportar CSV</button></div>
    <div class="card" style="overflow:hidden">
      <table>
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Método</th><th>Monto</th><th></th></tr></thead>
        <tbody>
          ${c.filteredHistory.map(e=>{ const cat=catById(e.categoria); return `
            <tr><td style="white-space:nowrap">${e.fecha}</td><td>${escapeHtml(e.descripcion)}</td>
            <td><span style="color:${cat.color}">${cat.name}</span></td><td>${e.metodo}</td><td>${fmtCLP(e.monto)}</td>
            <td style="text-align:right;white-space:nowrap"><button class="icon-btn" onclick="openEditModal('${e.id}')">✎</button>
            <button class="icon-btn" onclick="deleteExpense('${e.id}')">🗑</button></td></tr>`;}).join("")}
          ${c.filteredHistory.length===0 ? `<tr><td colspan="6" class="muted small" style="text-align:center;padding:24px">No se encontraron gastos.</td></tr>` : ""}
        </tbody>
      </table>
    </div>
  </div>`;
}
function attachHistoryHandlers(){
  const map = {"f-search":"search","f-cat":"cat","f-metodo":"metodo","f-from":"from","f-to":"to","f-sort":"sort"};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(!el) return;
    const evt = (el.tagName==="SELECT" || el.type==="date") ? "change" : "input";
    el.addEventListener(evt, ()=> setFilter(key, el.value));
  });
}

/* ---- Estadísticas ---- */
function estadisticasHtml(c){
  return `<div class="stack">
    <div class="grid grid-4">
      <div class="card p4"><p class="muted small">Categoría con más gasto</p><p class="serif" style="font-size:17px;margin-top:4px">${c.topCategory?c.topCategory.name:'—'}</p></div>
      <div class="card p4"><p class="muted small">Día de mayor gasto</p><p class="serif" style="font-size:17px;margin-top:4px">${c.topDayEntry?`${parseDate(c.topDayEntry[0]).getDate()} ${MESES[parseDate(c.topDayEntry[0]).getMonth()]}`:'—'}</p></div>
      <div class="card p4"><p class="muted small">Promedio diario</p><p class="serif" style="font-size:17px;margin-top:4px">${fmtCLP(c.avgDaily)}</p></div>
      <div class="card p4"><p class="muted small">Vs. mes anterior</p><p class="serif" style="font-size:17px;margin-top:4px;color:${c.deltaPct>0?'var(--danger)':'var(--accent)'}">${c.deltaPct===null?'—':`${c.deltaPct>0?'+':''}${c.deltaPct.toFixed(1)}%`}</p></div>
    </div>
    <div class="card p4"><p class="small" style="margin-bottom:8px">Gastos por categoría (este mes)</p>
      <div style="height:260px">${c.byCategory.length? '<canvas id="chartStatsPie"></canvas>' : '<p class="muted small" style="text-align:center;padding:40px 0">Sin datos este mes.</p>'}</div></div>
    <div class="card p4"><p class="small" style="margin-bottom:8px">Comparación de gastos por mes</p>
      <div style="height:260px"><canvas id="chartStatsBar"></canvas></div></div>
    <div class="card p4"><p class="small" style="margin-bottom:8px">Evolución acumulada del mes</p>
      <div style="height:260px"><canvas id="chartStatsLine"></canvas></div></div>
  </div>`;
}

/* ---- Presupuesto ---- */
function presupuestoHtml(c){
  const disponible = state.budget - c.totalMonth;
  const pct = c.budgetPct;
  const barColor = pct>=100 ? 'var(--danger)' : (pct>=70 ? 'var(--warn)' : 'var(--accent)');
  const alerta = pct>=100 ? "Superaste tu presupuesto mensual." : pct>=90 ? "Estás por superar tu presupuesto." : pct>=70 ? "Vas usando más del 70% de tu presupuesto." : null;
  return `<div class="stack">
    <div class="card p5">
      <div class="between" style="margin-bottom:8px">
        <span class="muted small">Presupuesto mensual</span>
        <div class="row"><span class="muted small">$</span><input id="budgetInput" type="number" value="${state.budget}" style="width:130px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-align:right" /></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div>
      <div class="between small" style="margin-top:10px">
        <span>Gastado: <strong>${fmtCLP(c.totalMonth)}</strong></span>
        <span>Disponible: <strong style="${disponible<0?'color:var(--danger)':''}">${fmtCLP(disponible)}</strong></span>
      </div>
      ${alerta ? `<div class="alert ${pct>=100?'alert-danger':'alert-warn'}">${alerta}</div>` : ""}
    </div>
    <div class="card p4">
      <p class="small" style="margin-bottom:10px">Gasto por categoría vs. presupuesto total</p>
      <div class="stack" style="gap:10px">
        ${c.byCategory.map(cat=>`
          <div>
            <div class="between small" style="margin-bottom:4px"><span>${cat.name}</span><span>${fmtCLP(cat.value)}</span></div>
            <div class="bar-track bar-track-sm"><div class="bar-fill" style="width:${state.budget>0?(cat.value/state.budget)*100:0}%;background:${cat.color}"></div></div>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}
function attachBudgetHandlers(){
  const el = document.getElementById("budgetInput");
  if(el) el.addEventListener("change", ()=> updateBudget(el.value));
}

/* ---- Modal ---- */
function modalHtml(){
  const e = state.editing;
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="between" style="margin-bottom:14px">
        <h2 class="serif" style="margin:0;font-size:18px">${e?"Editar gasto":"Agregar gasto"}</h2>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <form id="expenseForm">
        <div class="field"><label>Monto (CLP)</label><input type="number" min="0" id="m-monto" value="${e?e.monto:''}" placeholder="25000" required /></div>
        <div class="field"><label>Descripción</label><input id="m-desc" value="${e?escapeHtml(e.descripcion):''}" placeholder="Supermercado" required /></div>
        <div class="field field-row">
          <div><label>Categoría</label><select id="m-cat">${CATEGORIES.map(cc=>`<option value="${cc.id}" ${e&&e.categoria===cc.id?'selected':''}>${cc.name}</option>`).join("")}</select></div>
          <div><label>Fecha</label><input type="date" id="m-fecha" value="${e?e.fecha:todayISO()}" /></div>
        </div>
        <div class="field field-row">
          <div><label>Tipo de gasto</label><select id="m-tipo" onchange="document.getElementById('m-recurrente-row').style.display=this.value==='Mensual'?'flex':'none'">
            <option value="Diario" ${e&&e.tipo==='Diario'?'selected':''}>Diario</option>
            <option value="Mensual" ${e&&e.tipo==='Mensual'?'selected':''}>Mensual</option></select></div>
          <div><label>Método de pago</label><select id="m-metodo">${PAYMENT_METHODS.map(m=>`<option value="${m}" ${e&&e.metodo===m?'selected':''}>${m}</option>`).join("")}</select></div>
        </div>
        <div class="checkbox-row" id="m-recurrente-row" style="display:${e&&e.tipo==='Mensual'?'flex':'none'}">
          <input type="checkbox" id="m-recurrente" ${e&&e.recurrente?'checked':''} /><label style="margin:0">Es un gasto recurrente cada mes</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:6px">${e?"Guardar cambios":"Agregar gasto"}</button>
      </form>
    </div>
  </div>`;
}
function attachModalHandlers(){
  const form = document.getElementById("expenseForm");
  form.addEventListener("submit", ev=>{
    ev.preventDefault();
    const monto = Number(document.getElementById("m-monto").value);
    const descripcion = document.getElementById("m-desc").value.trim();
    if(!monto || !descripcion) return;
    const categoria = document.getElementById("m-cat").value;
    const fecha = document.getElementById("m-fecha").value || todayISO();
    const tipo = document.getElementById("m-tipo").value;
    const recurrente = tipo==="Mensual" ? document.getElementById("m-recurrente").checked : false;
    const metodo = document.getElementById("m-metodo").value;
    upsertExpense({
      id: state.editing ? state.editing.id : undefined,
      monto, descripcion, categoria, fecha, tipo, recurrente,
      diaCobro: tipo==="Mensual" ? parseDate(fecha).getDate() : undefined,
      metodo,
    });
  });
}

/* ---------------- Gráficos (Chart.js) ---------------- */
function themeColors(){
  const styles = getComputedStyle(document.documentElement);
  return { text: styles.getPropertyValue('--muted').trim() || '#888', grid: state.theme==='dark' ? '#2A2B28' : '#eee' };
}
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function drawDonut(id, byCategory){
  const el = document.getElementById(id); if(!el) return;
  destroyChart(id);
  const tc = themeColors();
  charts[id] = new Chart(el, {
    type: 'doughnut',
    data: { labels: byCategory.map(c=>c.name), datasets:[{ data: byCategory.map(c=>c.value), backgroundColor: byCategory.map(c=>c.color), borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ color: tc.text, boxWidth:10, font:{size:11} } },
        tooltip:{ callbacks:{ label: ctx => `${ctx.label}: ${fmtCLP(ctx.parsed)}` } } } }
  });
}
function drawBar(id, last6Months){
  const el = document.getElementById(id); if(!el) return;
  destroyChart(id);
  const tc = themeColors();
  charts[id] = new Chart(el, {
    type:'bar',
    data:{ labels:last6Months.map(m=>m.mes), datasets:[{ data:last6Months.map(m=>m.total), backgroundColor:'#2D6A4F', borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => fmtCLP(ctx.parsed.y) } } },
      scales:{ x:{ ticks:{color:tc.text}, grid:{display:false} },
        y:{ ticks:{color:tc.text, callback:v=>`${(v/1000).toFixed(0)}k`}, grid:{color:tc.grid} } } }
  });
}
function drawLine(id, dailyEvolution){
  const el = document.getElementById(id); if(!el) return;
  destroyChart(id);
  const tc = themeColors();
  charts[id] = new Chart(el, {
    type:'line',
    data:{ labels:dailyEvolution.map(d=>d.dia), datasets:[{ data:dailyEvolution.map(d=>d.acumulado), borderColor:'#C9A227', backgroundColor:'#C9A22722', fill:true, tension:.3, pointRadius:0, borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => fmtCLP(ctx.parsed.y) } } },
      scales:{ x:{ ticks:{color:tc.text}, grid:{display:false} },
        y:{ ticks:{color:tc.text, callback:v=>`${(v/1000).toFixed(0)}k`}, grid:{color:tc.grid} } } }
  });
}

/* ---------------- Init ---------------- */
render();
</script>
</body>
</html>
